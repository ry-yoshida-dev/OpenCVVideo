[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opencv-video"
version = "0.0.1"
authors = [
  { name="Ryuto Yoshida"},
]
description = "OpenCV-based video reading and writing utilities."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "numpy",
    "opencv-contrib-python",
    "id-manager @ git+https://github.com/ry-yoshida-dev/IDManager.git",
    "typing-extensions>=4.12",
]

[project.urls]
"Homepage" = "https://github.com/ry-yoshida-dev/OpenCVVideo"
"Bug Tracker" = "https://github.com/ry-yoshida-dev/OpenCVVideo/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opencv_video = ["py.typed"]

[tool.mypy]
files = ["src", "tests"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.uv]
exclude-newer = "7 days"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D"]
# Only public classes, methods, and functions need docstrings, and multi-line ones are the local style.
ignore = ["E501", "D100", "D104", "D105", "D200"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
